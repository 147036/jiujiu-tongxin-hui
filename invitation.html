<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>邀请函</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .card-header .icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 28px;
    }

    .card-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .card-header p {
      font-size: 14px;
      color: #888;
    }

    .card-body {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .info-item .label {
      font-size: 13px;
      color: #666;
      width: 60px;
      flex-shrink: 0;
    }

    .info-item .value {
      font-size: 15px;
      color: #1a1a1a;
      font-weight: 500;
    }

    .divider {
      height: 1px;
      background: #e8e8e8;
      margin: 15px 0;
    }

    .card-form h2 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group input::placeholder {
      color: #bbb;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* 成功状态 */
    .success-state {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-state .check-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 40px;
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .success-state h3 {
      font-size: 20px;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .success-state p {
      font-size: 14px;
      color: #888;
    }

    .error-msg {
      font-size: 12px;
      color: #e74c3c;
      margin-top: 5px;
      display: none;
    }

    .form-group.error input {
      border-color: #e74c3c;
    }

    .form-group.error .error-msg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 邀请函内容区 -->
    <div class="card-header">
      <div class="icon">💌</div>
      <h1>诚邀您的参与</h1>
      <p>活动邀请确认</p>
    </div>

    <div class="card-body">
      <div class="info-item">
        <span class="label">活动名称</span>
        <span class="value">OPC 2026 峰会</span>
      </div>
      <div class="info-item">
        <span class="label">活动时间</span>
        <span class="value">2026年9月15日</span>
      </div>
      <div class="info-item">
        <span class="label">活动地点</span>
        <span class="value">上海国际会议中心</span>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <span class="label">着装建议</span>
        <span class="value">商务休闲</span>
      </div>
    </div>

    <!-- 表单区 -->
    <div id="formSection">
      <div class="card-form">
        <h2>确认参与</h2>
        <form id="inviteForm" onsubmit="handleSubmit(event)">
          <div class="form-group" id="nameGroup">
            <label>您的姓名</label>
            <input type="text" id="name" placeholder="请输入真实姓名" autocomplete="name">
            <span class="error-msg">请输入您的姓名</span>
          </div>
          <div class="form-group" id="phoneGroup">
            <label>手机号码</label>
            <input type="tel" id="phone" placeholder="请输入手机号码" maxlength="11" autocomplete="tel">
            <span class="error-msg">请输入正确的手机号码</span>
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">确认参会</button>
        </form>
      </div>
    </div>

    <!-- 成功状态 -->
    <div id="successState" class="success-state">
      <div class="check-icon">✓</div>
      <h3>报名成功！</h3>
      <p>我们已收到您的信息，期待与您相见。</p>
    </div>
  </div>

  <script>
    // 手机号输入校验
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', function(e) {
      this.value = this.value.replace(/\D/g, '');
    });

    function handleSubmit(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      let isValid = true;

      // 重置错误状态
      document.getElementById('nameGroup').classList.remove('error');
      document.getElementById('phoneGroup').classList.remove('error');

      // 验证姓名
      if (!name) {
        document.getElementById('nameGroup').classList.add('error');
        isValid = false;
      }

      // 验证手机号
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        document.getElementById('phoneGroup').classList.add('error');
        isValid = false;
      }

      if (!isValid) return;

      // 模拟提交
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      setTimeout(() => {
        // 保存数据（实际项目中可发送到服务器）
        console.log('报名信息：', { name, phone });
        
        // 显示成功状态
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
      }, 800);
    }
  </script>
</body>
</html>
