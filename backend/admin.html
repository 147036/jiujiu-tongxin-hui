<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报名管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 28px; }
    .stats { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
    .stat-box { background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); min-width: 120px; text-align: center; }
    .stat-number { font-size: 32px; font-weight: bold; color: #667eea; }
    .stat-label { font-size: 12px; color: #666; margin-top: 5px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #667eea; color: white; font-weight: 500; font-size: 14px; }
    td { font-size: 14px; }
    tr:hover { background: #f8f9ff; }
    .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 16px; }
    .actions { padding: 15px; text-align: center; background: #f8f9ff; border-top: 1px solid #eee; }
    button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; margin: 5px; transition: all 0.3s; }
    button:hover { background: #5568d3; transform: translateY(-2px); }
    .export { background: #48bb78; }
    .export:hover { background: #38a169; }
    .clear { background: #f56565; }
    .clear:hover { background: #e53e3e; }
    .back-link { display: block; text-align: center; color: white; margin-top: 20px; opacity: 0.9; }
    .back-link:hover { opacity: 1; }
    @media (max-width: 600px) {
      th, td { padding: 8px 10px; font-size: 12px; }
      .stat-number { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 九九同心会报名管理</h1>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">总报名人数</div>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="todayCount">0</div>
        <div class="stat-label">今日新增</div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>序号</th>
            <th>姓名</th>
            <th>手机</th>
            <th>组别</th>
            <th>备注</th>
            <th>提交时间</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="empty">加载中...</td></tr>
        </tbody>
      </table>
      <div class="actions">
        <button onclick="loadData()">🔄 刷新</button>
        <button class="export" onclick="exportCSV()">📥 导出Excel</button>
        <button class="clear" onclick="clearAll()">🗑️ 清空数据</button>
      </div>
    </div>
    <a href="/" class="back-link">← 返回邀请函首页</a>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function loadData() {
      try {
        const res = await fetch(`${API_BASE}/api/entries`);
        const entries = await res.json();
        const tbody = document.getElementById('tableBody');
        const today = new Date().toDateString();

        document.getElementById('totalCount').textContent = entries.length;
        document.getElementById('todayCount').textContent = entries.filter(e => new Date(e.submittedAt).toDateString() === today).length;

        if (entries.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无报名，等待第一位参与者</td></tr>';
          return;
        }

        tbody.innerHTML = entries.map((e, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${escapeHtml(e.name)}</td>
            <td>${escapeHtml(e.phone)}</td>
            <td>${escapeHtml(e.group || '-')}</td>
            <td>${escapeHtml(e.remark || '-')}</td>
            <td>${formatTime(e.submittedAt)}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">加载失败，请刷新重试</td></tr>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(isoString) {
      const d = new Date(isoString);
      return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function exportCSV() {
      fetch(`${API_BASE}/api/entries`)
        .then(res => res.json())
        .then(entries => {
          const headers = ['序号', '姓名', '手机', '组别', '备注', '提交时间'];
          const rows = entries.map((e, i) => [i + 1, e.name, e.phone, e.group, e.remark, formatTime(e.submittedAt)]);
          const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
          const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `九九同心会报名_${new Date().toISOString().slice(0,10)}.csv`;
          link.click();
        });
    }

    function clearAll() {
      if (!confirm('确定要清空所有报名数据吗？此操作不可恢复！')) return;
      fetch(`${API_BASE}/api/submit`, { method: 'DELETE' })
        .then(() => loadData())
        .catch(() => alert('清空失败'));
    }

    // 自动刷新
    loadData();
    setInterval(loadData, 30000); // 每30秒自动刷新
  </script>
</body>
</html>
